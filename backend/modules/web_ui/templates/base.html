<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysWatch v2.1 - {% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: {
                brand: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b' },
            }}}
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; }
        body {
            background-color: #0a0e1a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        .card { background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; border-radius: 0.75rem; backdrop-filter: blur(4px); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; transition: all 0.15s; cursor: pointer; border: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #059669; color: white; }
        .btn-primary:hover { background: #10b981; }
        .btn-danger { background: #e11d48; color: white; }
        .btn-danger:hover { background: #f43f5e; }
        .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        .btn-secondary:hover { background: #334155; }
        .input { width: 100%; background: rgba(2, 6, 23, 0.6); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #e2e8f0; }
        .input::placeholder { color: #475569; }
        .input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
        .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 500; border: 1px solid; }
        .badge-up { background: rgba(16,185,129,0.1); color: #34d399; border-color: rgba(16,185,129,0.3); }
        .badge-down { background: rgba(244,63,94,0.1); color: #f43f5e; border-color: rgba(244,63,94,0.3); }
        .badge-warn { background: rgba(245,158,11,0.1); color: #fbbf24; border-color: rgba(245,158,11,0.3); }
        .badge-info { background: rgba(14,165,233,0.1); color: #38bdf8; border-color: rgba(14,165,233,0.3); }
        .badge-crit { background: rgba(244,63,94,0.1); color: #f43f5e; border-color: rgba(244,63,94,0.3); }
        table { border-collapse: collapse; width: 100%; }
        th { text-align: left; padding: 0.625rem 1rem; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 0.625rem 1rem; font-size: 0.875rem; }
        tr { border-bottom: 1px solid rgba(30,41,59,0.6); }
        tr:hover { background: rgba(30,41,59,0.3); transition: background 0.15s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.75rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-56 shrink-0 border-r border-slate-800 bg-slate-950/95 flex flex-col h-full overflow-hidden">
            <div class="px-4 py-4 border-b border-slate-800 shrink-0 flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg">
                    <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-100 tracking-tight">SysWatch</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest">v2.1 Secure</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-4">
                <div>
                    <p class="px-3 mb-1.5 text-[10px] font-semibold text-slate-600 uppercase tracking-widest">Monitoring</p>
                    <div class="space-y-0.5">
                        <a href="/" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'dashboard' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="layout-grid" class="w-4 h-4 shrink-0"></i>Dashboard</a>
                        <a href="/hosts" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'hosts' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="server" class="w-4 h-4 shrink-0"></i>Hosts</a>
                        <a href="/alerts" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'alerts' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="bell" class="w-4 h-4 shrink-0"></i>Alerts</a>
                        <a href="/events" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'events' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="activity" class="w-4 h-4 shrink-0"></i>Events</a>
                    </div>
                </div>
                <div>
                    <p class="px-3 mb-1.5 text-[10px] font-semibold text-slate-600 uppercase tracking-widest">Intelligence</p>
                    <div class="space-y-0.5">
                        <a href="/ai" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'ai' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="brain" class="w-4 h-4 shrink-0"></i>AI Insights</a>
                        <a href="/reports" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'reports' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="file-text" class="w-4 h-4 shrink-0"></i>Reports</a>
                    </div>
                </div>
                <div>
                    <p class="px-3 mb-1.5 text-[10px] font-semibold text-slate-600 uppercase tracking-widest">Automation</p>
                    <div class="space-y-0.5">
                        <a href="/remote" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'remote' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="terminal" class="w-4 h-4 shrink-0"></i>Remote Exec</a>
                    </div>
                </div>
                <div>
                    <p class="px-3 mb-1.5 text-[10px] font-semibold text-slate-600 uppercase tracking-widest">System</p>
                    <div class="space-y-0.5">
                        <a href="/settings" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all {% if active_page == 'settings' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent{% endif %}"><i data-lucide="settings" class="w-4 h-4 shrink-0"></i>Settings</a>
                        <a href="/logout" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium transition-all text-slate-400 hover:text-rose-400 hover:bg-slate-800/50 border border-transparent"><i data-lucide="log-out" class="w-4 h-4 shrink-0"></i>Logout</a>
                    </div>
                </div>
            </nav>
            <div class="px-4 py-2.5 border-t border-slate-800 shrink-0">
                <div class="flex items-center gap-2 text-xs text-slate-500">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="system-status">All systems secure</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Global auth token helper
        function getToken() {
            return localStorage.getItem('token') || '';
        }
        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
        }
        async function apiGet(url) {
            const res = await fetch(url, { headers: authHeaders() });
            if (res.status === 401) { window.location.href = '/login'; return null; }
            return res.json();
        }
        async function apiPost(url, body) {
            const res = await fetch(url, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
            if (res.status === 401) { window.location.href = '/login'; return null; }
            return res.json();
        }
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
