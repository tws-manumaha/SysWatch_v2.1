version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syswatch-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_NAME=syswatch
      - DB_USER=syswatch
      - DB_PASSWORD=${DB_PASSWORD:-syswatch_secure_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ENABLE_SSL=${ENABLE_SSL:-false}
      - FLASK_DEBUG=0
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backup_data:/app/backups
      - log_data:/app/logs
    networks:
      - syswatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syswatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - syswatch-net

  mysql:
    image: mysql:8.0
    container_name: syswatch-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_pass}
      - MYSQL_DATABASE=syswatch
      - MYSQL_USER=syswatch
      - MYSQL_PASSWORD=${DB_PASSWORD:-syswatch_secure_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syswatch-net

  redis:
    image: redis:7-alpine
    container_name: syswatch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - syswatch-net

  nginx:
    image: nginx:alpine
    container_name: syswatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - syswatch-net

  certbot:
    image: certbot/certbot:latest
    container_name: syswatch-certbot
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw
    networks:
      - syswatch-net

volumes:
  mysql_data:
  redis_data:
  backup_data:
  log_data:
  certbot_www:
  certbot_certs:

networks:
  syswatch-net:
    driver: bridge