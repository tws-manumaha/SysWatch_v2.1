version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-syswatch_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syswatch}
      MYSQL_USER: ${MYSQL_USER:-syswatch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syswatch_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-syswatch}:${MYSQL_PASSWORD:-syswatch_pass}@db:3306/${MYSQL_DATABASE:-syswatch}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_me_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backup_data:/var/backups/syswatch

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_letsencrypt:/var/www/letsencrypt

volumes:
  mysql_data:
  redis_data:
  backup_data:
  nginx_certs:
  nginx_letsencrypt: